name: SPY 0DTE Synthetic Signal → Discord

on:
  schedule:
    # 09:25 ET ≈ 13:25 UTC (covers EST/EDT). Runs before 09:30 open.
    - cron: "25 13 * * 1-5"
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "daily_signal.py"
      - "engine.py"
      - "strategy.py"
      - ".github/workflows/signal.yml"

permissions:
  contents: read

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy pandas-market-calendars requests matplotlib

      - name: Generate synthetic signal (dry checks + live refresh)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "Python $(python --version)"
          # Refresh pulls live CBOE VIX/VIX9D + SPY — no historical chain needed
          python daily_signal.py --refresh --dry-run --json-out signal.json
          cat signal.json
          echo "--- payload preview ---"
          python -c "import json; print(open('signal.json').read()[:2000])"

      - name: Post to Discord
        if: env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python daily_signal.py --refresh --json-out signal.json
          echo "Posted. Signal for $(jq -r .provenance.target_session signal.json 2>/dev/null || cat signal.json | grep target_session)"

      - name: No webhook configured — instructions
        if: env.DISCORD_WEBHOOK_URL == ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "::warning::DISCORD_WEBHOOK_URL secret not set — skipping Discord post."
          echo "Add it in GitHub: Settings > Secrets and variables > Actions > New repository secret"
          echo "Name: DISCORD_WEBHOOK_URL"
          echo "Value: https://discord.com/api/webhooks/... (your webhook URL)"
          echo "Then re-run this workflow via Actions > Run workflow"
          echo ""
          echo "Dry-run payload already printed above — synthetic only, not financial advice."

      - name: Upload signal artifact
        uses: actions/upload-artifact@v4
        with:
          name: signal-${{ github.run_id }}
          path: signal.json
          retention-days: 30
